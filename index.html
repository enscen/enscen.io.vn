<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đạo Tỉnh Thức - Lời Khai Thị</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: #000000;
    --sub: #666666;
    --btn-bg: #f2f2f7;
    --btn-border: #d1d1d6;
    --opt-bg: #ffffff;
    --opt-text: #000000;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #000000;
      --text: #ffffff;
      --sub: #888888;
      --btn-bg: #1c1c1e;
      --btn-border: #38383a;
      --opt-bg: #1c1c1e;
      --opt-text: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --text: #ffffff;
    --sub: #888888;
    --btn-bg: #1c1c1e;
    --btn-border: #38383a;
    --opt-bg: #1c1c1e;
    --opt-text: #ffffff;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --text: #000000;
    --sub: #666666;
    --btn-bg: #f2f2f7;
    --btn-border: #d1d1d6;
    --opt-bg: #ffffff;
    --opt-text: #000000;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    transition: background 0.3s ease, color 0.3s ease;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 24px;
    user-select: none;
  }
  .controls {
    position: fixed;
    top: 20px;
    right: 24px;
    display: flex;
    gap: 10px;
    z-index: 100;
  }
  select, button {
    background: var(--btn-bg);
    color: var(--text);
    border: 1px solid var(--btn-border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    outline: none;
    transition: all 0.2s;
  }
  select option {
    background-color: var(--opt-bg);
    color: var(--opt-text);
    padding: 6px;
  }
  select:hover, button:hover {
    opacity: 0.85;
  }
  .container {
    max-width: 900px;
    width: 100%;
    text-align: center;
    padding: 20px;
  }
  .quote {
    font-size: clamp(22px, 3.2vw, 38px);
    line-height: 1.55;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin: 0 auto 24px;
    transition: opacity 0.35s ease-in-out, transform 0.35s ease-in-out;
    opacity: 1;
    transform: translateY(0);
  }
  .author {
    font-size: clamp(14px, 1.6vw, 17px);
    color: var(--sub);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: opacity 0.35s ease-in-out;
  }
  .fade-out {
    opacity: 0;
    transform: translateY(8px);
  }
</style>
</head>
<body>

<div class="controls">
  <select id="lang">
    <option value="vi">Tiếng Việt</option>
    <option value="en">English</option>
    <option value="zh">中文</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
    <option value="de">Deutsch</option>
    <option value="th">ไทย</option>
    <option value="hi">हिन्दी</option>
    <option value="bo">བོད་སྐད།</option>
    <option value="ru">Русский</option>
  </select>
  <button id="theme">🌓 Hệ thống</button>
</div>

<div class="container">
  <div class="quote" id="q">...</div>
  <div class="author" id="a"></div>
</div>

<script>
const QUOTES = ["Trái tim thật sự của Đạo là Đức hạnh Ba-la-mật.", "Trong mọi va chạm cuộc sống các con phải thức tỉnh được tâm hồn, biến tham sân si thù hận thành lòng biết ơn và tình thương.", "Đức Phật Liên Hoa Sanh dạy: Các con hãy nhìn xuống bằng cái thấy bao trùm, nhưng phải đi lên bằng đức hạnh.", "Sư phụ ta dạy: Đức hạnh là Pháp thân Phật.", "Thù hận mang tính chia rẽ, tình yêu (lòng biết ơn và tình thương) mang tính kết nối.", "Càng chia rẽ thì tâm càng nhỏ, tâm càng nhỏ thì càng trở thành nô lệ cho bản ngã; càng kết nối thì tâm càng rộng, tâm càng rộng thì càng gần bản tính bao trùm vô ngã của Phật.", "Mặc dù họ làm hại các con, nhưng trên một góc nhìn khác, họ lại chính là ơn nhân cứu các con không bị đọa trong cận tử nghiệp.", "Nếu các con đối mặt với khổ mà sanh lòng biết ơn và tình thương thì mọi tham sân si thù hận của các con sẽ trở thành năng lượng sống bất tử.", "Nếu các con thật sự biết ơn thì ngay cả cái chết các con cũng sẽ không sợ. Yêu chính là biết ơn.", "Nếu các con thật sự biết ơn thì các con sẽ biết ơn ngay cả những chiếc lá rụng, những hạt bụi trần, mọi chi tiết của quá khứ.", "Thương mình là nhận ra mình đang nhốt mình, mình đang trói buộc mình trong phạm vi tư tưởng nhỏ hẹp của bản ngã.", "Trong mọi va chạm trái ý của cuộc đời... tôi vẫn thấy biết ơn.", "Tâm chấp ngã sẽ biến Đức Hạnh trở thành Đạo Đức Giả.", "Đạo đức không phải đạo Giác Ngộ, nhưng Đạo đức là cần thiết cho Đạo giác ngộ.", "Đạo đức là khi con hạ mình xuống thấp nhất, giống như một hồ nước hoặc đại dương mênh mông, mọi nguồn nước sẽ đổ về đó.", "Tham sân si trở thành thuốc bón cho Trí tuệ, nhờ trí tuệ mà các con thực hành được đạo Vô Ngã.", "Chuyển hóa là pháp Sám hối cao thượng.", "Phật ở trong tất cả, Phật bao trùm tất cả, Phật bao trùm mọi đối cực nhị nguyên.", "Biết tu vì người khác hóa ra lại cũng chính là biết thương chính mình.", "Dù tưởng sướng hay tưởng khổ các con cũng không trối bỏ mà bao trùm hết thì đấy là bình đẳng.", "Bình đẳng bằng đức hạnh là đối mặt với mọi cảnh khổ, bất như ý thì tham sân si thù hận chuyển hóa thành lòng biết ơn và tình thương.", "Lòng biết ơn có thể bộc lộ rất phũ phàng dưới góc nhìn trí tuệ của Đạo.", "Mọi sự vật hiện tượng, muôn loài mà các con nhìn thấy đều là những tác phẩm nghệ thuật vĩ đại của Chư Phật.", "Trong tình yêu đó, các con là trái tim của người khác, và người khác là trái tim của các con.", "Khi anh tát tôi, khi anh hại tôi, tôi vẫn thấy biết ơn vì nhờ anh mà tôi có cơ hội chiến thắng chính mình.", "Đức hạnh Ba-la-mật là gốc rễ của cây Bồ-đề.", "Nếu thiếu đức hạnh thì sự hiểu biết về Tánh Không sẽ biến thành ma nghiệp.", "Thức tỉnh tâm hồn chính là biến phiền não thành Bồ-đề.", "Sự căm hận làm cho tâm trí bị thu hẹp vào một điểm cố chấp.", "Biết ơn kẻ thù là đòn quyết định để đập tan bản ngã.", "Người không biết ơn thì dù có đọc hàng ngàn pho kinh vẫn là kẻ phàm phu.", "Lòng biết ơn mở ra cánh cửa của vũ trụ bao trùm.", "Mỗi giọt nước mắt khổ đau là một giọt sương mai nuôi dưỡng hạt giống Bồ-đề.", "Chịu đựng trong oán hận là nhẫn nhục phàm phu; chịu đựng trong biết ơn là Nhẫn nhục Ba-la-mật.", "Thương người hại mình mới là tình thương vô điều kiện của Chư Phật.", "Khi tâm con biết ơn, mọi nghịch cảnh đều biến thành mạn-đà-la cúng dường.", "Người sống trong lòng biết ơn thì đi đến đâu cũng là cõi Tịnh Độ.", "Không có đức hạnh thì không thể gánh vác được Pháp đại thừa.", "Đức hạnh là chiếc áo giáp kiên cố nhất trước mọi giông bão nhân sinh.", "Sống bằng đức hạnh là sống bằng bản tính chân thật của Như Lai.", "Gieo hạt giống biết ơn sẽ gặt hái quả vị giải thoát.", "Tình thương bao trùm đập tan ranh giới giữa ta và người.", "Khi không còn phân biệt người ơn và kẻ thù, con đã chạm vào trái tim của Đạo.", "Biến năng lượng thù hận thành ánh sáng của trí tuệ và tình thương.", "Mỗi nghịch cảnh là một bài toán để con rèn luyện đức hạnh.", "Hạ mình xuống thấp nhất là con đường tiến lên cao nhất.", "Đức hạnh không biểu hiện ở lời nói suông mà ở hành động trong va chạm.", "Chân thật biết ơn nghịch cảnh là chiếc chìa khóa mở khóa ngục bản ngã.", "Tình yêu chân thật không bao giờ có sự chiếm hữu hay đòi hỏi.", "Sống trọn vẹn với lòng biết ơn là con đang sống trong Pháp thân Phật.", "Chìa khóa pháp giải thoát là Không có cấu tạo.", "Vì không có cấu tạo nên ta không do ai đẻ ra, không từ đâu đến, không đi về đâu... gọi là Như Lai sẵn ngay đây.", "Vì không có cấu tạo nên ta không thể bị hủy diệt, nên ta bất tử.", "Tất cả các pháp đã sẵn giải thoát ngay đây.", "Sắc tức thị Không, Không cấu tạo nhưng vẫn tồn tại.", "Mọi hoàn cảnh bất như ý là Sắc tướng, Nhẫn nhục Ba-la-mật là Thị Không.", "Tin vào không cấu tạo thì phát sinh bình đẳng, đồng đẳng, vô ngã.", "Nhẫn nhục Ba-la-mật là trong tất cả mọi hoàn cảnh trái ý xảy đến, không bị tham sân si thù hận và sợ hãi chi phối.", "Bản ngã mà bản ngã thì lấy dục vọng làm ý nghĩa nhưng không giải thoát; bản ngã mà vô ngã thì lấy dục vọng làm ý nghĩa nhưng giải thoát.", "Chấp nhận mọi tướng giằng co của mọi đối cực tư tưởng là giải thoát sẵn ngay đây.", "Yêu hay không yêu, thanh tịnh hay bất tịnh ô uế cũng đều đã sẵn giải thoát đồng đẳng.", "Sông tự biến thành đất vì Phật chính là sông mà cũng chính là đất.", "Tánh Không dẫn đầu tất cả các pháp.", "Vô tướng là tướng biến đổi, vừa có vừa không sẵn trong nhau, chuyển hóa nhau.", "Tánh là tính chất cấu tạo tự nhiên của các pháp, cấu tạo của Phật Tánh là không có cấu tạo.", "Không cấu tạo nên không sanh không diệt.", "Sắc và Không không phải là hai thứ riêng biệt mà là một thể thống nhất.", "Thấy rõ tính không cấu tạo thì mọi sợ hãi diệt vong tự sụp đổ.", "Mọi sự vật hiện tượng chỉ là sự gá hợp tạm thời của các duyên.", "Tánh Không không phải là hư vô vô cảm mà là sự sống bao trùm vô tận.", "Nhận ra không cấu tạo là chấm dứt cuộc lang thang vô lượng kiếp.", "Không do ai sinh ra nên không ai có thể tiêu diệt.", "Cõi đời là một dòng chảy liên tục của các hiện tượng không có chủ thể cố định.", "Trụ vào Tánh Không mà không dính mắc vào từ ngữ Tánh Không.", "Chân lý Không cấu tạo l const themes = ['system', 'light', 'dark'];
let themeIdx = parseInt(localStorage.getItem('theme_idx') || '0');

function applyTheme() {
  const mode = themes[themeIdx];
  if (mode === 'system') {
    document.documentElement.removeAttribute('data-theme');
    document.documentElement.style.colorScheme = 'light dark';
    themeBtn.textContent = '🌓 Hệ thống';
  } else if (mode === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.documentElement.style.colorScheme = 'dark';
    themeBtn.textContent = '🌙 Nền đen';
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    document.documentElement.style.colorScheme = 'light';
    themeBtn.textContent = '☀️ Nền trắng';
  }
  localStorage.setItem('theme_idx', themeIdx);
}
applyTheme();

themeBtn.onclick = () => {
  themeIdx = (themeIdx + 1) % themes.length;
  applyTheme();
};

const transCache = {};

async function translateText(text, targetLang) {
  if (targetLang === 'vi') return text;
  const key = text + '_' + targetLang;
  if (transCache[key]) return transCache[key];

  const gCode = gLangMap[targetLang] || targetLang;
  try {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=' + gCode + '&dt=t&q=' + encodeURIComponent(text);
    const res = await fetch(url);
    const data = await res.json();
    let result = '';
    if (data && data[0]) {
      result = data[0].map(item => item[0]).join('');
    }
    const finalTxt = result || text;
    transCache[key] = finalTxt;
    return finalTxt;
  } catch(e) {
    return text;
  }
}

let historyList = [];
let historyIdx = -1;
let autoTimer = null;
const INTERVAL = 20000;

function getRandomQuote() {
  const idx = Math.floor(Math.random() * QUOTES.length);
  return QUOTES[idx];
}

function resetTimer() {
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = setInterval(nextQuote, INTERVAL);
}

async function renderCurrent() {
  if (historyIdx < 0 || !historyList[historyIdx]) return;
  const quoteText = historyList[historyIdx];
  
  qEl.classList.add('fade-out');
  aEl.classList.add('fade-out');

  const translatedText = await translateText(quoteText, currentLang);
  const authorText = authorMap[currentLang] || authorMap['vi'];

  setTimeout(() => {
    qEl.textContent = '“' + translatedText + '”';
    aEl.textContent = '— ' + authorText;
    qEl.classList.remove('fade-out');
    aEl.classList.remove('fade-out');
  }, 300);
}

async function nextQuote() {
  if (historyIdx < historyList.length - 1) {
    historyIdx++;
  } else {
    const item = getRandomQuote();
    historyList.push(item);
    historyIdx = historyList.length - 1;
  }
  await renderCurrent();
  resetTimer();
}

async function prevQuote() {
  if (historyIdx > 0) {
    historyIdx--;
    await renderCurrent();
    resetTimer();
  }
}

langSel.onchange = async () => {
  currentLang = langSel.value;
  localStorage.setItem('lang', currentLang);
  await renderCurrent();
  resetTimer();
};

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') {
    prevQuote();
  } else if (e.key === 'ArrowRight') {
    nextQuote();
  }
});

let touchStartX = 0;
window.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });
window.addEventListener('touchend', (e) => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (diff > 50) prevQuote();
  else if (diff < -50) nextQuote();
}, { passive: true });

nextQuote();
</script>
