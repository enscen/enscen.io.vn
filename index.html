<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đạo Tỉnh Thức - Lời Khai Thị</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: #000000;
    --sub: #666666;
    --btn-bg: #f2f2f7;
    --btn-border: #d1d1d6;
    --opt-bg: #ffffff;
    --opt-text: #000000;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #000000;
      --text: #ffffff;
      --sub: #888888;
      --btn-bg: #1c1c1e;
      --btn-border: #38383a;
      --opt-bg: #1c1c1e;
      --opt-text: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --text: #ffffff;
    --sub: #888888;
    --btn-bg: #1c1c1e;
    --btn-border: #38383a;
    --opt-bg: #1c1c1e;
    --opt-text: #ffffff;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --text: #000000;
    --sub: #666666;
    --btn-bg: #f2f2f7;
    --btn-border: #d1d1d6;
    --opt-bg: #ffffff;
    --opt-text: #000000;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    transition: background 0.3s ease, color 0.3s ease;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 24px;
    user-select: none;
  }
  .controls {
    position: fixed;
    top: 20px;
    right: 24px;
    display: flex;
    gap: 10px;
    z-index: 100;
  }
  select, button {
    background: var(--btn-bg);
    color: var(--text);
    border: 1px solid var(--btn-border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    outline: none;
    transition: all 0.2s;
  }
  select option {
    background-color: var(--opt-bg);
    color: var(--opt-text);
    padding: 6px;
  }
  select:hover, button:hover {
    opacity: 0.85;
  }
  .container {
    max-width: 900px;
    width: 100%;
    text-align: center;
    padding: 20px;
  }
  .quote {
    font-size: clamp(22px, 3.2vw, 38px);
    line-height: 1.55;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin: 0 auto 24px;
    transition: opacity 0.35s ease-in-out, transform 0.35s ease-in-out;
    opacity: 1;
    transform: translateY(0);
  }
  .author {
    font-size: clamp(14px, 1.6vw, 17px);
    color: var(--sub);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: opacity 0.35s ease-in-out;
  }
  .fade-out {
    opacity: 0;
    transform: translateY(8px);
  }
</style>
</head>
<body>

<div class="controls">
  <select id="lang">
    <option value="vi">Tiếng Việt</option>
    <option value="en">English</option>
    <option value="zh">中文</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
    <option value="de">Deutsch</option>
    <option value="th">ไทย</option>
    <option value="hi">हिन्दी</option>
    <option value="bo">བོད་སྐད།</option>
    <option value="ru">Русский</option>
  </select>
  <button id="theme">🌓 Hệ thống</button>
</div>

<div class="container">
  <div class="quote" id="q">...</div>
  <div class="author" id="a"></div>
</div>

<script>
let QUOTES = [];

const qEl = document.getElementById('q');
const aEl = document.getElementById('a');
const langSel = document.getElementById('lang');
const themeBtn = document.getElementById('theme');

const authorMap = {
  vi: 'Đạo Tỉnh Thức',
  en: 'The Path of Awakening',
  zh: '觉醒之道',
  ja: '覚醒の道',
  ko: '각성의 길',
  fr: "La Voie de l'Éveil",
  es: 'El Camino del Despertar',
  de: 'Der Pfad des Erwachens',
  th: 'วิถีแห่งการตื่นรู้',
  hi: 'जागृति का मार्ग',
  bo: 'རྣམ་སད་ཀྱི་ལམ།',
  ru: 'Путь Пробуждения'
};

const gLangMap = {
  vi: 'vi',
  en: 'en',
  zh: 'zh-CN',
  ja: 'ja',
  ko: 'ko',
  fr: 'fr',
  es: 'es',
  de: 'de',
  th: 'th',
  hi: 'hi',
  bo: 'bo',
  ru: 'ru'
};

let currentLang = localStorage.getItem('lang') || 'vi';
langSel.value = currentLang;

const themes = ['system', 'light', 'dark'];
let themeIdx = parseInt(localStorage.getItem('theme_idx') || '0');

function applyTheme() {
  const mode = themes[themeIdx];
  if (mode === 'system') {
    document.documentElement.removeAttribute('data-theme');
    document.documentElement.style.colorScheme = 'light dark';
    themeBtn.textContent = '🌓 Hệ thống';
  } else if (mode === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.documentElement.style.colorScheme = 'dark';
    themeBtn.textContent = '🌙 Nền đen';
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    document.documentElement.style.colorScheme = 'light';
    themeBtn.textContent = '☀️ Nền trắng';
  }
  localStorage.setItem('theme_idx', themeIdx);
}
applyTheme();

themeBtn.onclick = () => {
  themeIdx = (themeIdx + 1) % themes.length;
  applyTheme();
};

const transCache = {};

async function translateText(text, targetLang) {
  if (targetLang === 'vi') return text;
  const key = text + '_' + targetLang;
  if (transCache[key]) return transCache[key];

  const gCode = gLangMap[targetLang] || targetLang;
  try {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=' + gCode + '&dt=t&q=' + encodeURIComponent(text);
    const res = await fetch(url);
    const data = await res.json();
    let result = '';
    if (data && data[0]) {
      result = data[0].map(item => item[0]).join('');
    }
    const finalTxt = result || text;
    transCache[key] = finalTxt;
    return finalTxt;
  } catch(e) {
    return text;
  }
}

let historyList = [];
let historyIdx = -1;
let autoTimer = null;
const INTERVAL = 20000;

function getRandomQuote() {
  if (!QUOTES.length) return '...';
  const idx = Math.floor(Math.random() * QUOTES.length);
  return QUOTES[idx];
}

function resetTimer() {
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = setInterval(nextQuote, INTERVAL);
}

async function renderCurrent() {
  if (historyIdx < 0 || !historyList[historyIdx]) return;
  const quoteText = historyList[historyIdx];
  
  qEl.classList.add('fade-out');
  aEl.classList.add('fade-out');

  const translatedText = await translateText(quoteText, currentLang);
  const authorText = authorMap[currentLang] || authorMap['vi'];

  setTimeout(() => {
    qEl.textContent = '“' + translatedText + '”';
    aEl.textContent = '— ' + authorText;
    qEl.classList.remove('fade-out');
    aEl.classList.remove('fade-out');
  }, 300);
}

async function nextQuote() {
  if (historyIdx < historyList.length - 1) {
    historyIdx++;
  } else {
    const item = getRandomQuote();
    historyList.push(item);
    historyIdx = historyList.length - 1;
  }
  await renderCurrent();
  resetTimer();
}

async function prevQuote() {
  if (historyIdx > 0) {
    historyIdx--;
    await renderCurrent();
    resetTimer();
  }
}

langSel.onchange = async () => {
  currentLang = langSel.value;
  localStorage.setItem('lang', currentLang);
  await renderCurrent();
  resetTimer();
};

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') {
    prevQuote();
  } else if (e.key === 'ArrowRight') {
    nextQuote();
  }
});

let touchStartX = 0;
window.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });
window.addEventListener('touchend', (e) => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (diff > 50) prevQuote();
  else if (diff < -50) nextQuote();
}, { passive: true });

async function init() {
  try {
    const res = await fetch('quote.txt?t=' + Date.now());
    const text = await res.text();
    QUOTES = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
  } catch(e) {
    console.error('Lỗi tải quote.txt:', e);
  }
  nextQuote();
}

init();
</script>
</body>
</html>
